# =============================================================================
# AURIX — cấu hình nginx làm reverse proxy
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/aurix
#   sudo ln -s /etc/nginx/sites-available/aurix /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d aurixvietnam.vn -d www.aurixvietnam.vn
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ghi nhớ: `AURIX_TRUST_PROXY=1` trong .env phải khớp với việc có đúng MỘT lớp
# proxy ở đây. Thêm Cloudflare phía trước thì đổi thành 2.
# =============================================================================

upstream aurix_app {
    server 127.0.0.1:4477;
    keepalive 32;
}

# Giới hạn tần suất ở tầng nginx — lớp chắn thứ nhất, trước khi chạm tới Node
limit_req_zone $binary_remote_addr zone=aurix_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=aurix_login:10m rate=1r/s;

# ---------- Chuyển hướng HTTP sang HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name aurixvietnam.vn www.aurixvietnam.vn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://aurixvietnam.vn$request_uri; }
}

# ---------- Gộp www về tên miền chính ----------
server {
    listen 443 ssl;
    http2 on;
    server_name www.aurixvietnam.vn;
    ssl_certificate     /etc/letsencrypt/live/aurixvietnam.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurixvietnam.vn/privkey.pem;
    return 301 https://aurixvietnam.vn$request_uri;
}

# ---------- Máy chủ chính ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aurixvietnam.vn;

    ssl_certificate     /etc/letsencrypt/live/aurixvietnam.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurixvietnam.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Thân request tối đa 128 KB: không có tuyến nào nhận tệp tải lên,
    # nên mọi request lớn hơn thế đều là rác hoặc là tấn công.
    client_max_body_size 128k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Tiêu đề bảo mật do Node đặt; nginx không ghi đè để tránh lệch hai nơi.
    proxy_hide_header X-Powered-By;
    server_tokens off;

    # Nén: Node đã nén sẵn tệp tĩnh, nginx chỉ chuyển tiếp nguyên trạng.
    gzip off;

    location = /api/auth/login {
        limit_req zone=aurix_login burst=5 nodelay;
        proxy_pass http://aurix_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=aurix_api burst=20 nodelay;
        proxy_pass http://aurix_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://aurix_app;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/aurix.access.log;
    error_log  /var/log/nginx/aurix.error.log warn;
}
