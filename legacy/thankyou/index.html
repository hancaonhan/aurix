<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cảm ơn | Aurix Vietnam</title>
    <meta name="description" content="Cảm ơn bạn đã để lại thông tin. Đội ngũ chuyên gia của Aurix sẽ liên hệ trong thời gian sớm nhất." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../index.css" />
    <style>
      .thankyou-wrapper {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px 20px;
        position: relative;
        z-index: 10;
      }
      .thankyou-card {
        background: rgba(8, 30, 34, 0.62);
        border: 1px solid rgba(229, 201, 139, 0.22);
        border-radius: 12px;
        padding: 60px 40px;
        max-width: 600px;
        width: 100%;
        backdrop-filter: blur(12px);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.22);
        position: relative;
        overflow: hidden;
      }
      .thankyou-card::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
        opacity: 0.8;
      }
      .thankyou-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 30px;
        color: var(--gold);
        background: rgba(229, 201, 139, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(229, 201, 139, 0.3);
      }
      .thankyou-icon svg {
        width: 40px;
        height: 40px;
      }
      .thankyou-card h1 {
        font-size: 40px;
        margin-bottom: 16px;
        color: var(--white);
      }
      .thankyou-card p {
        color: rgba(255, 255, 255, 0.7);
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 40px;
      }
      .logo-link {
        position: absolute;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
      }
      .logo-link img {
        height: 40px;
        width: auto;
      }
      @media (max-width: 768px) {
        .thankyou-card { padding: 40px 20px; }
        .thankyou-card h1 { font-size: 32px; }
      }
    </style>
  </head>
  <body>
    <div class="visual-signature" aria-hidden="true">
      <svg class="flow-lines" viewBox="0 0 1440 800" preserveAspectRatio="none">
        <path d="M-100,500 C 300,450 500,650 800,350 S 1200,150 1550,50" stroke="rgba(229, 201, 139, 0.25)" stroke-width="1.5" fill="none" />
        <path d="M-50,700 C 400,550 700,450 1000,150 S 1300,50 1550,-50" stroke="rgba(86, 210, 214, 0.15)" stroke-width="1" fill="none" />
        <path d="M200,850 C 600,650 800,600 1100,400 S 1350,200 1550,150" stroke="rgba(229, 201, 139, 0.1)" stroke-width="2" stroke-dasharray="4 6" fill="none" />
      </svg>
      <div class="glow-node node-1"></div>
      <div class="glow-node node-teal node-2"></div>
      <div class="glow-node node-3"></div>
      <div class="glow-node node-teal node-4"></div>
    </div>

    <a href="../index.html" class="logo-link">
      <img src="../assets/logo-trang-aurix.webp" alt="Aurix Vietnam" />
    </a>

    <div class="thankyou-wrapper">
      <div class="thankyou-card">
        <div class="thankyou-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h1>Đã gửi yêu cầu thành công</h1>
        <p>
          Cảm ơn bạn đã để lại thông tin. Đội ngũ chuyên gia của Aurix sẽ liên hệ lại với bạn trong thời gian sớm nhất để tư vấn lộ trình phù hợp.
        </p>
        <a href="../index.html" class="btn btn-primary" style="font-size: 16px; padding: 16px 32px; width: auto; display: inline-flex;">
          ← Quay lại trang chủ
        </a>
      </div>
    </div>
  </body>
</html>
